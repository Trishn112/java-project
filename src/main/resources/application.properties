# ==============================================================================
# AI-Based Movie Recommendation System - Application Configuration
# ==============================================================================

# Server Port
server.port=8080

# Application Name
spring.application.name=ai-movie-recommendation-system

# Thymeleaf Template Engine Configuration
spring.thymeleaf.cache=false

# TMDB (The Movie Database) API Configuration
# Reads from environment variable TMDB_API_KEY if present, otherwise defaults to configured TMDB Read Access Token
tmdb.api.key=${TMDB_API_KEY:eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiJjMmFmZjkwOTI5MWI5MTg2YjNlOTFmM2RkYTg0NTRiNSIsIm5iZiI6MTc4Mzg0MTQ3Ny41NzYsInN1YiI6IjZhNTM0MmM1NGQwNzQzZTMzMDY1NTU5NyIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.y4fXAMuG1Hvi8quMzBtrpAT91K7KlOvaLPYrSjS9QS0}

# Default Number of Recommendations
recommendation.top-n=10

# ------------------------------------------------------------------------------
# MySQL 8.0+ Database Configuration
# Reads from environment variables: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
# ------------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/movie_recommendation_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root123}

# Hikari Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# Logging Configuration
logging.level.com.recommendation=INFO
logging.level.org.springframework.web=INFO
